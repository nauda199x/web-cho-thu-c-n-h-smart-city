name: Build iOS Sideload Test

on:
  push:
    branches: [main]
    paths:
      - "ios-sideload/**"
      - ".github/workflows/build-ios-sideload.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios-sideload
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          cd ios-sideload
          xcodebuild \
            -project SanKhach.xcodeproj \
            -scheme SanKhach \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          cd ios-sideload
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SanKhach.app Payload/
          /usr/bin/zip -qry SanKhach-V1-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SanKhach-V1-unsigned-ipa
          path: ios-sideload/SanKhach-V1-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
